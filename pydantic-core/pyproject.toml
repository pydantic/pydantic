[build-system]
requires = ['maturin>=1.13.3,<2']
build-backend = 'maturin'

[project]
name = 'pydantic_core'
description = "Core functionality for Pydantic validation and serialization"
requires-python = '>=3.10'
license = 'MIT'
license-files = ['LICENSE']
authors = [
    { name = 'Samuel Colvin', email = 's@muelcolvin.com' },
    { name = 'Adrian Garcia Badaracco', email = '1755071+adriangb@users.noreply.github.com' },
    { name = 'David Montague', email = 'david@pydantic.dev' },
    { name = 'David Hewitt', email = 'mail@davidhewitt.dev' },
    { name = 'Sydney Runkle', email = 'sydneymarierunkle@gmail.com' },
    { name = 'Victorien Plot', email = 'contact@vctrn.dev' },
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Programming Language :: Python :: Implementation :: GraalPy',
    'Programming Language :: Rust',
    'Framework :: Pydantic',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    'Operating System :: POSIX :: Linux',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: MacOS',
    'Typing :: Typed',
]
dependencies = ['typing-extensions>=4.14.1']
dynamic = ['readme', 'version']

[project.urls]
Homepage = 'https://github.com/pydantic'
Funding = 'https://github.com/sponsors/samuelcolvin'
Source = 'https://github.com/pydantic/pydantic/tree/main/pydantic-core'

[tool.maturin]
python-source = "python"
module-name = "pydantic_core._pydantic_core"
bindings = 'pyo3'
# when using `uv` to build `pydantic-core`, use the `dev` profile
# can override by e.g. `make build-pgo` and then using `uv run --no-sync`
editable-profile = 'dev'

[tool.ruff]
line-length = 120
target-version = 'py310'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I', 'UP']
extend-ignore = [
    'E721', # using type() instead of isinstance() - we use this in tests
]
flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'double' }
mccabe = { max-complexity = 13 }
isort = { known-first-party = ['pydantic_core', 'tests'] }

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = 'tests'
log_format = '%(name)s %(levelname)s: %(message)s'
filterwarnings = ['error']
timeout = 30
xfail_strict = true
# min, max, mean, stddev, median, iqr, outliers, ops, rounds, iterations
addopts = [
    '--benchmark-columns',
    'min,mean,stddev,outliers,rounds,iterations',
    '--benchmark-group-by',
    'group',
    '--benchmark-warmup',
    'on',
    '--benchmark-disable',                        # this is enable by `make benchmark` when you actually want to run benchmarks
]

[tool.coverage.run]
source = ['pydantic_core']
branch = true

[tool.coverage.report]
precision = 2
exclude_also = [
    'raise\sNotImplementedError',
    '@(typing\.)?overload',
    'class .*\bProtocol\):',
    '(typing\.)?.assert_never',
]

# configuring https://github.com/pydantic/hooky
[tool.hooky]
reviewers = ['Viicos', 'davidhewitt']
require_change_file = false

[tool.pyright]
include = ['python/pydantic_core', 'tests/test_typing.py']
reportUnnecessaryTypeIgnoreComment = true

[tool.inline-snapshot.shortcuts]
fix = ["create", "fix"]

[tool.uv]
required-version = '>=0.7.2'
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "build.rs" },
    { dir = ".cargo" },
    { dir = "src" },
    { dir = "python" },
    { env = "MATURIN_PEP517_ARGS" },
    { env = "RUSTFLAGS" }
]
