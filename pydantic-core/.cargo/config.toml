[build]
rustflags = []

# Keep frame pointers so that native profilers can unwind through pydantic-core,
# matching CPython 3.15+ (see https://peps.python.org/pep-0831/).
# Note: this is ignored if `RUSTFLAGS` or `CARGO_ENCODED_RUSTFLAGS` is set.
[target.'cfg(not(target_family = "wasm"))']
rustflags = ["-C", "force-frame-pointers=yes"]

# see https://pyo3.rs/main/building_and_distribution.html#macos
[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]

[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]
