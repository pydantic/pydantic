name: codspeed

on:
  push:
    branches:
      - main
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

env:
  UV_FROZEN: true
  UV_PYTHON: 3.14

permissions:
  contents: read

jobs:
  codspeed-profiling:
    name: ${{ matrix.suite == 'benchmarks' && 'CodSpeed profiling' || format('Model corpus ({0})', matrix.suite) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [benchmarks, mcp, openai, anthropic, google-genai]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Using this action is still necessary for CodSpeed to work:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: install deps
        run: uv sync --all-packages --group testing-extra --extra email --frozen

      - name: install rust stable
        # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          components: llvm-tools
          toolchain: stable

      - name: cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: pydantic-core

      - name: install pydantic-core with profiling symbols
        run: |
          cd pydantic-core
          uv pip uninstall pytest-speed
          make build-pgo
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 'line-tables-only'
          CARGO_PROFILE_RELEASE_STRIP: 'false'

      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4.18.5
        with:
          mode: simulation
          run: |
            if [ "$BENCHMARK_SUITE" = benchmarks ]; then
              uv run --no-sync pytest ./tests/benchmarks ./tests/pydantic_core/benchmarks \
                --ignore=tests/benchmarks/test_model_corpus.py \
                --ignore=tests/benchmarks/test_mcp_model_corpus.py --codspeed
            else
              uv run --no-sync pytest tests/benchmarks/test_model_corpus.py -k "[$BENCHMARK_SUITE]" --codspeed
            fi
        env:
          BENCHMARK_SUITE: ${{ matrix.suite }}
